name: Build MusicDrop

on:
  workflow_dispatch:
  push:
    branches: [ main, feature/musicdrop-polish-20261008 ]
    paths:
      - "BUILD_TRIGGER"
      - "MusicDrop/**"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Theos dependencies
        run: brew install ldid xz
      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
      - name: Install iOS SDKs
        run: |
          rm -rf "$HOME/theos/sdks"
          git clone --depth=1 https://github.com/theos/sdks.git "$HOME/theos/sdks"
      - name: Build package
        run: make clean package FINALPACKAGE=1
      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: MusicDrop-DEB
          path: packages/*.deb
          if-no-files-found: error
